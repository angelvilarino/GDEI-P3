<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AuraVault — Vista 3D</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      .scene-wrap {
        position: relative;
        flex: 1;
        overflow: hidden;
        background: #0d1117;
      }
      #scene-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #scene-tooltip {
        position: absolute;
        display: none;
        pointer-events: none;
        background: rgba(0,0,0,0.88);
        color: #eef3f0;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.82rem;
        z-index: 10;
        max-width: 210px;
        line-height: 1.5;
        border: 1px solid rgba(255,255,255,0.12);
      }
      #scene-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: 300px;
        max-width: 90vw;
        height: 100%;
        background: rgba(8,16,24,0.93);
        backdrop-filter: blur(14px);
        color: #eef3f0;
        overflow-y: auto;
        z-index: 20;
        display: none;
        padding: 14px 16px;
        box-sizing: border-box;
        border-left: 1px solid rgba(255,255,255,0.10);
        transition: transform 0.25s ease;
      }
      #scene-panel h3 { margin: 34px 0 8px; color: #fff; font-size: 1.05rem; }
      #scene-panel img { width: 100%; border-radius: 8px; margin-bottom: 10px; max-height: 180px; object-fit: cover; }
      #scene-panel p { margin: 5px 0; font-size: 0.86rem; line-height: 1.5; color: #d0d8d5; }
      #panel-close {
        position: absolute;
        top: 10px;
        right: 12px;
        background: none;
        border: none;
        color: #aaa;
        font-size: 1.5rem;
        cursor: pointer;
        line-height: 1;
        padding: 0;
      }
      #panel-close:hover { color: #fff; }
      .risk-bar-track { background: rgba(255,255,255,0.12); border-radius: 4px; height: 7px; margin: 4px 0; }
      .risk-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
      .sensor-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.78rem;
        font-weight: 600;
        color: #fff;
      }
      #room-info-bar {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.72);
        backdrop-filter: blur(8px);
        color: #eef3f0;
        padding: 7px 18px;
        border-radius: 20px;
        font-size: 0.82rem;
        pointer-events: none;
        z-index: 5;
        white-space: nowrap;
        border: 1px solid rgba(255,255,255,0.10);
      }
      #legend-bar {
        position: absolute;
        bottom: 50px;
        left: 14px;
        background: rgba(0,0,0,0.72);
        backdrop-filter: blur(8px);
        color: #eef3f0;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 0.75rem;
        z-index: 5;
        border: 1px solid rgba(255,255,255,0.10);
        line-height: 1.8;
      }
      .legend-dot {
        display: inline-block;
        width: 10px; height: 10px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
    </script>
  </head>
  <body data-page="room-3d" style="margin:0;overflow:hidden">
    <div class="app-shell" style="height:100vh;display:flex;flex-direction:column">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark"></div>
          <h1>AuraVault 3D</h1>
          <nav class="nav-links">
            <a class="nav-link" data-page="dashboard" href="/" data-i18n="dashboard">Dashboard</a>
            <a class="nav-link" data-page="centers" href="/centers" data-i18n="centers">Centros</a>
            <a class="nav-link" data-page="control-center" href="/control" data-i18n="control">Control</a>
          </nav>
        </div>
        <div class="toolbar">
          <a id="backToRoom" class="btn" href="#"><i class="fas fa-arrow-left"></i> Sala</a>
          <button class="btn" id="langToggle">ES</button>
          <button class="btn" id="themeToggle">Oscuro</button>
        </div>
      </header>

      <div class="scene-wrap" id="sceneWrap">
        <canvas id="scene-canvas"></canvas>

        <div id="scene-tooltip"></div>

        <div id="scene-panel">
          <button id="panel-close">&times;</button>
          <div id="panel-content"></div>
        </div>

        <div id="room-info-bar">Cargando sala...</div>

        <div id="legend-bar">
          <div><span class="legend-dot" style="background:#2ecc71"></span>Sensor activo (on)</div>
          <div><span class="legend-dot" style="background:#e74c3c"></span>Sensor inactivo (off)</div>
          <div><span class="legend-dot" style="background:#e67e22"></span>Sensor en fallo</div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/room_3d.js') }}"></script>
  </body>
</html>
