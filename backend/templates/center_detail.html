<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AuraVault - Detalle de Centro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body data-page="center-detail">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark"></div>
          <h1>AuraVault</h1>
          <nav class="nav-links">
            <a class="nav-link" data-page="dashboard" href="/" data-i18n="dashboard">Dashboard</a>
            <a class="nav-link" data-page="centers" href="/centers" data-i18n="centers">Centros</a>
            <a class="nav-link" data-page="control-center" href="/control" data-i18n="control">Control</a>
          </nav>
        </div>
        <div class="toolbar">
          <button class="btn" id="langToggle">ES</button>
          <button class="btn" id="themeToggle">Oscuro</button>
        </div>
      </header>

      <section class="card fade-up" style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
          <h2 id="centerTitle" style="margin:0" data-i18n="center">Centro</h2>
          <div id="centerStatus"></div>
        </div>
      </section>

      <section class="gauges-row stagger" style="margin-top:14px">
        <article class="card gauge-card"><canvas id="gTemp"></canvas><div id="gTemp-value" class="kpi value">-</div></article>
        <article class="card gauge-card"><canvas id="gHum"></canvas><div id="gHum-value" class="kpi value">-</div></article>
        <article class="card gauge-card"><canvas id="gCo2"></canvas><div id="gCo2-value" class="kpi value">-</div></article>
        <article class="card gauge-card"><canvas id="gNoise"></canvas><div id="gNoise-value" class="kpi value">-</div></article>
        <article class="card gauge-card"><canvas id="gOcc"></canvas><div id="gOcc-value" class="kpi value">-</div></article>
      </section>

      <main class="grid stagger" style="margin-top:14px">
        <article class="card">
            <div class="controls-row" style="margin-bottom:8px">
              <h3 style="margin:0" data-i18n="history">Histórico ambiental</h3>
              <select id="rangeSelect" class="input">
                <option value="1h">1h</option>
                <option value="6h">6h</option>
                <option value="24h" selected>24h</option>
                <option value="7d">7d</option>
              </select>
            </div>
            <h4 data-i18n="temperature" style="margin:8px 0 4px">Temperatura</h4>
            <div class="chart-wrap" style="height:180px"><canvas id="chartTemp"></canvas></div>
            <h4 data-i18n="humidity" style="margin:12px 0 4px">Humedad</h4>
            <div class="chart-wrap" style="height:180px"><canvas id="chartHum"></canvas></div>
            <h4 data-i18n="co2" style="margin:12px 0 4px">CO2</h4>
            <div class="chart-wrap" style="height:180px"><canvas id="chartCo2"></canvas></div>
            <h4 style="margin:12px 0 4px">LAeq (Ruido)</h4>
            <div class="chart-wrap" style="height:180px"><canvas id="chartNoise"></canvas></div>
            <h4 data-i18n="occupancy" style="margin:12px 0 4px">Aforo</h4>
            <div class="chart-wrap" style="height:200px;margin-top:4px"><canvas id="chartCrowd"></canvas></div>
        </article>

        <article class="card">
            <h3 data-i18n="room">Salas</h3>
            <div id="roomsList" class="grid grid-3"></div>
        </article>

        <article class="card">
            <h3 data-i18n="devices">Actuadores</h3>
            <div id="actuatorPanel" class="grid grid-3"></div>
        </article>

        <article class="card">
            <h3 data-i18n="riskWorks">Obras en riesgo</h3>
            <div id="riskList" class="alert-list"></div>
        </article>

        <article class="card">
            <h3 data-i18n="grafana">Grafana — Monitorización avanzada</h3>
            <div id="grafanaError" class="empty-state" style="display:none;margin-bottom:8px">
                <p>⚠️ El panel de Grafana no está disponible. Verifique que el servicio esté activo.</p>
            </div>
            <div class="grafana-frame" id="grafanaContainer">
                <iframe id="grafanaFrame" title="Grafana center" allowfullscreen></iframe>
            </div>
        </article>
      </main>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/center_detail.js') }}"></script>
  </body>
</html>
